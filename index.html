<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Listesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>🛒 Market Listesi</h1>

    <div id="sync-bar" class="sync-bar">
      <div id="sync-off" class="sync-row">
        <input type="text" id="sync-code-input" placeholder="Liste kodu gir" autocomplete="off" maxlength="24">
        <button id="sync-join-btn" type="button">Katıl</button>
        <button id="sync-create-btn" type="button">Yeni Kod</button>
      </div>
      <div id="sync-on" class="sync-row" style="display: none;">
        <span class="sync-code-label">Kod: <strong id="sync-code-display"></strong></span>
        <button id="sync-copy-btn" type="button">Kopyala</button>
        <button id="sync-leave-btn" type="button">Ayrıl</button>
      </div>
      <div id="sync-status" class="sync-status"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="shopping" type="button">Market Listesi</button>
      <button class="tab-btn" data-tab="pantry" type="button">Evdekiler</button>
    </div>

    <section id="shopping-view" class="tab-view active">
      <form id="add-form" class="item-form">
        <input type="text" id="item-input" class="name-input" placeholder="Ürün ekle (örn. Süt)" autocomplete="off" required>
        <input type="number" id="qty-input" class="qty-input" placeholder="Adet" min="1" value="1">
        <select id="category-input" class="category-select">
          <option value="Meyve & Sebze">Meyve & Sebze</option>
          <option value="Süt Ürünleri">Süt Ürünleri</option>
          <option value="Et & Tavuk">Et & Tavuk</option>
          <option value="Fırın">Fırın</option>
          <option value="İçecek">İçecek</option>
          <option value="Temizlik">Temizlik</option>
          <option value="Diğer" selected>Diğer</option>
        </select>
        <button type="submit">Ekle</button>
      </form>

      <ul id="list" class="item-list"></ul>

      <div class="footer">
        <span id="count">0 ürün</span>
        <button id="clear-btn" class="clear-btn" type="button">Tümünü Temizle</button>
      </div>
    </section>

    <section id="pantry-view" class="tab-view">
      <form id="pantry-add-form" class="item-form">
        <input type="text" id="pantry-item-input" class="name-input" placeholder="Ürün ekle (örn. Un)" autocomplete="off" required>
        <input type="number" id="pantry-qty-input" class="qty-input" placeholder="Adet" min="0" value="1">
        <select id="pantry-category-input" class="category-select">
          <option value="Meyve & Sebze">Meyve & Sebze</option>
          <option value="Süt Ürünleri">Süt Ürünleri</option>
          <option value="Et & Tavuk">Et & Tavuk</option>
          <option value="Fırın">Fırın</option>
          <option value="İçecek">İçecek</option>
          <option value="Temizlik">Temizlik</option>
          <option value="Diğer" selected>Diğer</option>
        </select>
        <button type="submit">Ekle</button>
      </form>

      <ul id="pantry-list" class="item-list"></ul>

      <div class="footer">
        <span id="pantry-count">0 ürün</span>
        <button id="pantry-clear-btn" class="clear-btn" type="button">Tümünü Temizle</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
